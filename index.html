<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reading Log</title>
<style>
:root{--bg:#eef3f7;--ink:#1d2b3a;--mut:#667788;--acc:#1f4e79;--pen:#f5c542;--line:#cfd9e2}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;align-items:center}
select,input,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
button{width:auto;cursor:pointer;background:var(--acc);color:#fff;border:0}
button.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
button.pen{background:var(--pen);color:var(--ink);font-weight:600}
.bar select{flex:1}
nav{display:flex;margin:12px 0;border-bottom:2px solid var(--line)}
nav button{background:none;color:var(--mut);border-radius:0;flex:1;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--acc);border-color:var(--pen);font-weight:600}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
label{font-size:14px;color:var(--mut);display:grid;grid-template-columns:minmax(0,1fr);gap:4px;min-width:0}
input,select{min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
#reader{width:100%}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
#td{font:600 40px system-ui,sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin-bottom:8px}
#tm .bar button,#ef .bar button{flex:1}
#ed{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:flex;padding:12px;overflow:auto}
#ef{margin:auto;width:min(92vw,420px)}
.ht{width:100%;border-collapse:collapse}
.ht th,.ht td{border:0;border-bottom:1px solid var(--line);padding:8px 4px;font-size:15px;height:auto;white-space:normal;text-align:left;text-overflow:clip}
.ht th{font-size:13px;color:var(--mut);height:auto}
.ht button{padding:6px 10px}
ul{list-style:none;padding:0;margin:16px 0}
li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li button{background:none;color:var(--mut);padding:4px 10px}
small{color:var(--mut)}
html{-webkit-text-size-adjust:100%}
html,body{max-width:100%;overflow-x:hidden}
main{width:100%}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;padding:12px;overflow-y:auto}
#cam[hidden]{display:none}
#wrap{overflow-x:auto;margin-top:12px}
.pgo{margin-bottom:16px}
.pg{min-width:820px;background:#fff;padding:12px;border:1px solid var(--line);color:#111}
.hd{text-align:right;font-size:16px;font-weight:300;margin-right:2px}
.hd u{display:inline-block;min-width:170px;text-align:center;text-decoration:none;border-bottom:1px solid #111;font-weight:400}
.pg h1{text-align:center;margin:2px 0 8px;font:900 30px "Arial Rounded MT Bold","Avenir Next",system-ui,sans-serif;font-variant:small-caps;letter-spacing:1px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #222;padding:2px 8px;font-size:15px}
th{font-weight:300;font-size:19px;height:40px;line-height:1.15}th.s{font-size:12px}
td{height:40px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.c{text-align:center}
[hidden]{display:none!important}
@media print{
 .noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}
 #wrap{overflow:visible;margin:0}.pgo{margin:0;page-break-after:always}.pg{min-width:0;border:0;padding:0}
 td,th{box-sizing:border-box;height:9.5mm;padding:0 2mm}th{font-size:14pt}th.s{font-size:10pt}td{font-size:11pt}
 .pg h1{font-size:24pt;margin:0 0 2mm}.hd{font-size:12pt}
 @page{size:landscape;margin:8mm}
}
/* If the phone ignores landscape and prints portrait, turn the sheet sideways to fill the page */
@media print and (orientation:portrait){
 .pgo{width:175mm;height:240mm;overflow:hidden}
 .pg{width:240mm;height:175mm;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}
}
</style></head>
<body><main>
<div class="noprint">
 <div class="bar"><select id="prof" aria-label="Child"></select>
 <button class="alt" id="edit" title="Edit">Edit</button><button class="alt" id="add" title="Add child">+ Child</button></div>
 <p id="empty" hidden>Add a child to start logging.</p>
 <nav id="nav"><button data-t="log" class="on">Log</button><button data-t="hist">History</button><button data-t="print">Print</button></nav>
</div>
<div id="main" hidden>
 <section id="tlog" class="noprint">
  <div class="card" id="tm"><div id="td">0:00</div>
   <div class="bar"><button type="button" id="ts">Start</button><button type="button" class="alt" id="tu">Use time</button><button type="button" class="alt" id="tr">Reset</button></div></div>
  <form id="f">
   <button type="button" class="pen" id="scan">Scan book barcode</button>
   <input type="hidden" id="isbn">
   <label>Book title<input id="title" required autocomplete="off"></label>
   <label>Author<input id="author" autocomplete="off"></label>
   <div class="row">
    <label>Date<input type="date" id="date" required></label>
    <label>Minutes<select id="min"></select></label>
   </div>
   <button>Save entry</button>
   <small id="msg"></small>
  </form>
 </section>
 <section id="thist" class="noprint" hidden>
  <div class="bar"><button class="alt" id="hp" aria-label="Previous week">◀</button><div id="hl" style="flex:1;text-align:center;font-weight:600"></div><button class="alt" id="hn" aria-label="Next week">▶</button></div>
  <p style="text-align:center;margin:8px 0"><button class="alt" id="ht">This week</button> <small id="hs"></small></p>
  <table class="ht" id="htb"></table>
 </section>
 <section id="tprint" hidden>
  <div class="noprint bar"><label style="flex:1">Week containing<input type="date" id="wk"></label><button id="pr" style="align-self:end">Print / PDF</button></div>
  <div id="wrap"></div>
 </section>
</div>
<p class="noprint"><button class="alt" id="bk">Backup</button> <small id="st"></small></p>
</main>
<div id="ed" hidden>
 <form id="ef" class="card">
  <label>Book title<input id="et" required></label>
  <label>Author<input id="ea"></label>
  <div class="row"><label>Date<input type="date" id="ed2" required></label><label>Minutes<input type="number" id="em" min="1" max="600" inputmode="numeric" required></label></div>
  <div class="bar"><button>Save</button><button type="button" class="alt" id="edel">Delete</button><button type="button" class="alt" id="ecx">Cancel</button></div>
 </form></div>
<div id="cam" hidden>
 <div class="bar"><input id="man" inputmode="numeric" placeholder="Or type the ISBN"><button id="go" class="pen">Look up</button><button id="x" class="alt">Cancel</button></div>
 <small style="color:#fff;text-align:center">Hold the barcode flat, about a hand's width away, and fill the box. Use the ISBN barcode on the back, not the price code.</small>
 <div class="bar" id="ctl" hidden><input type="range" id="zm" aria-label="Zoom" style="padding:0;flex:1" hidden><button id="tq" class="alt" hidden>Light</button></div>
 <div id="reader"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="initAuth()"></script>
<script>
// Paste your Google OAuth client ID here to turn on automatic Drive backup.
const CLIENT_ID='';

let db={profiles:[],activeId:null,entries:[],books:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const cur=()=>db.profiles.find(p=>p.id===db.activeId);

// ---- local storage (IndexedDB) ----
const idb=new Promise((res,rej)=>{const r=indexedDB.open('readinglog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function kv(m,v){const d=await idb;return new Promise((res,rej)=>{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get('db'):s.put(v,'db');q.onsuccess=()=>res(q.result);q.onerror=rej})}
async function save(){await kv('put',db);clearTimeout(save.t);if(CLIENT_ID)save.t=setTimeout(backup,1500)}

// ---- Google Drive backup (one-way: local overwrites the backup file) ----
const G='https://www.googleapis.com';let tok=null,exp=0,tc=null;
const auth=()=>({Authorization:'Bearer '+tok});
const status=t=>$('#st').textContent=t;
function initAuth(){
 if(!CLIENT_ID){status('Backup not set up');return}
 tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',
  callback:r=>{if(r.access_token){tok=r.access_token;exp=Date.now()+r.expires_in*1000-60000;checkRestore()}}});
 status('Tap Backup to connect');
}
async function remoteId(){const r=await fetch(G+"/drive/v3/files?spaces=appDataFolder&q=name%3D'readinglog.json'&fields=files(id)",{headers:auth()});return(await r.json()).files?.[0]?.id}
async function backup(){
 if(!tok||Date.now()>exp){status('Backup paused: tap Backup to reconnect');return}
 try{
  const id=await remoteId(),body=JSON.stringify(db);
  if(id)await fetch(G+'/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:auth(),body});
  else{const b='rl',m=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:'readinglog.json',parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
   await fetch(G+'/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{...auth(),'Content-Type':'multipart/related; boundary='+b},body:m})}
  status('Backed up '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
 }catch{status('Backup failed, will retry on next save')}
}
async function checkRestore(){
 try{
  const id=await remoteId();
  if(!id){backup();return}
  if(!db.profiles.length&&!db.entries.length){
   if(confirm('Backup found. Restore your data?')){
    db=await(await fetch(G+'/drive/v3/files/'+id+'?alt=media',{headers:auth()})).json();
    await kv('put',db);render();status('Restored from backup');
   }
  }else backup();
 }catch{status('Could not reach backup')}
}
$('#bk').onclick=()=>CLIENT_ID&&tc?tc.requestAccessToken():alert('Backup is not set up yet. Add a Google client ID in index.html.');

// ---- profiles ----
$('#prof').onchange=e=>{db.activeId=e.target.value;tUsed=false;save();render()};
$('#add').onclick=()=>{
 const name=prompt('Child name');if(!name)return;
 const no=prompt('Student # (optional)')||'';
 const id='p'+Date.now();db.profiles.push({id,name,no});db.activeId=id;save();render();
};
$('#edit').onclick=()=>{
 const p=cur();if(!p)return;
 const name=prompt('Child name',p.name);if(!name)return;
 p.name=name;p.no=prompt('Student #',p.no)??p.no;save();render();
};

// ---- entry form ----
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
// Same child, same day, same book title (ignoring capitals/punctuation) -> one row with minutes added up
function merged(es){const m=new Map();for(const e of es){const k=e.date+'|'+norm(e.title),x=m.get(k);if(x)x.minutes+=e.minutes;else m.set(k,{...e})}return[...m.values()]}
function setMin(m){
 const s=$('#min');s.querySelectorAll('.x').forEach(o=>o.remove());
 if(![...s.options].some(o=>+o.value===m)){const o=new Option(m+' (timer)',m);o.className='x';s.add(o)}
 s.value=m;
}
$('#min').innerHTML=Array.from({length:12},(_,i)=>`<option>${(i+1)*15}</option>`).join('');setMin(30);
$('#date').value=iso(new Date());$('#wk').value=iso(new Date());
let tUsed=false,mt,editId=null;
function msg(t){const m=$('#msg');m.textContent=t;clearTimeout(mt);mt=setTimeout(()=>m.textContent='',4000)}
$('#f').onsubmit=e=>{
 e.preventDefault();
 const p=cur(),isbn=$('#isbn').value,title=$('#title').value.trim(),author=$('#author').value.trim(),date=$('#date').value,mins=+$('#min').value;
 const ex=db.entries.find(x=>x.pid===p.id&&x.date===date&&norm(x.title)===norm(title));
 if(ex){ex.minutes+=mins;if(!ex.author)ex.author=author;msg(`Added to today's entry: ${ex.minutes} min total`)}
 else{db.entries.push({id:Date.now(),pid:p.id,date,title,author,minutes:mins,isbn});msg('Saved')}
 if(isbn)db.books[isbn]={title,author};
 if(tUsed){p.timer={run:null,acc:0};tUsed=false}
 $('#title').value=$('#author').value=$('#isbn').value='';setMin(30);
 save();render();
};

// ---- timer (one per child; works from the clock, so it keeps counting while the phone sleeps) ----
const tms=p=>p?(p.timer?.acc||0)+(p.timer?.run?Date.now()-p.timer.run:0):0;
function tick(){
 const p=cur();if(!p)return;
 const s=Math.floor(tms(p)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
 $('#td').textContent=(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0');
 $('#ts').textContent=p.timer?.run?'Pause':(s?'Resume':'Start');
}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
function pauseT(p){if(p.timer?.run){p.timer.acc+=Date.now()-p.timer.run;p.timer.run=null}}
$('#ts').onclick=()=>{
 const p=cur();p.timer=p.timer||{run:null,acc:0};
 if(p.timer.run)pauseT(p);else p.timer.run=Date.now();
 save();tick();
};
$('#tr').onclick=()=>{const p=cur();if(tms(p)&&!confirm('Reset the timer to 0?'))return;p.timer={run:null,acc:0};tUsed=false;save();tick()};
$('#tu').onclick=()=>{
 const p=cur();if(!p||!tms(p))return msg('Start the timer first.');
 pauseT(p);
 let m=Math.max(1,Math.round(tms(p)/60000));
 if(m>180){const a=prompt(`Timer shows ${Math.floor(m/60)} h ${m%60} min. How many minutes should be logged?`,60);if(!a)return;m=Math.min(600,Math.max(1,Math.round(+a)||60))}
 setMin(m);tUsed=true;save();tick();msg(`${m} min set. Pick the book, then tap Save.`);
};

// ---- history tab (one Mon-Sun week at a time; edit or delete entries) ----
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>addDays(s,-((new Date(s+'T00:00').getDay()+6)%7));
let hw=monday(iso(new Date()));
function hist(){
 const p=cur();if(!p)return;
 const end=addDays(hw,6);
 $('#hl').textContent=fmt(hw)+' – '+fmt(end);
 const es=db.entries.filter(e=>e.pid===p.id&&e.date>=hw&&e.date<=end).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
 $('#hs').textContent=es.length?es.reduce((a,e)=>a+e.minutes,0)+' min total':'';
 $('#htb').innerHTML=es.length?'<tr><th>Date</th><th>Book</th><th>Min</th><th></th></tr>'+es.map(e=>`<tr><td>${fmt(e.date)}</td><td><b>${esc(e.title)}</b><br><small>${esc(e.author)}</small></td><td>${e.minutes}</td><td style="white-space:nowrap"><button class="alt" data-ed="${e.id}">Edit</button> <button class="alt" data-del="${e.id}" aria-label="Delete">✕</button></td></tr>`).join(''):'<tr><td><small>No entries this week.</small></td></tr>';
}
$('#hp').onclick=()=>{hw=addDays(hw,-7);hist()};
$('#hn').onclick=()=>{hw=addDays(hw,7);hist()};
$('#ht').onclick=()=>{hw=monday(iso(new Date()));hist()};
$('#htb').onclick=e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.dataset.del&&confirm('Delete this entry?')){db.entries=db.entries.filter(x=>x.id!=t.dataset.del);save();render()}
 if(t.dataset.ed){
  const x=db.entries.find(y=>y.id==t.dataset.ed);editId=x.id;
  $('#et').value=x.title;$('#ea').value=x.author;$('#ed2').value=x.date;$('#em').value=x.minutes;$('#ed').hidden=false;
 }
};
$('#ecx').onclick=()=>$('#ed').hidden=true;
$('#edel').onclick=()=>{if(confirm('Delete this entry?')){db.entries=db.entries.filter(x=>x.id!==editId);$('#ed').hidden=true;save();render()}};
$('#ef').onsubmit=e=>{
 e.preventDefault();const x=db.entries.find(y=>y.id===editId);if(!x)return;
 x.title=$('#et').value.trim();x.author=$('#ea').value.trim();x.date=$('#ed2').value;x.minutes=Math.max(1,Math.round(+$('#em').value));
 $('#ed').hidden=true;save();render();
};

// ---- barcode scan + lookup ----
let sc;
let busy=false;
async function stopScan(){try{await sc.stop();sc.clear()}catch{}$('#cam').hidden=true;$('#ctl').hidden=true}
// Only accept real book barcodes: 978/979 prefix with a valid check digit (ignores price codes and misreads)
function okIsbn(t){
 if(!/^97[89]\d{12}$/.test(t)&&!/^97[89]\d{10}$/.test(t))return false;
 if(t.length!==13)return false;
 const s=[...t.slice(0,12)].reduce((a,d,i)=>a+(+d)*(i%2?3:1),0);
 return(10-s%10)%10===+t[12];
}
function setupCtl(){
 try{
  const c=sc.getRunningTrackCameraCapabilities(),z=c.zoomFeature(),t=c.torchFeature();
  const zm=$('#zm'),tq=$('#tq');
  zm.hidden=!z.isSupported();tq.hidden=!t.isSupported();
  if(z.isSupported()){zm.min=z.min();zm.max=z.max();zm.step=z.step();zm.value=Math.min(z.max(),Math.max(z.min(),2));z.apply(+zm.value);zm.oninput=()=>z.apply(+zm.value)}
  if(t.isSupported()){let on=false;tq.onclick=()=>{on=!on;t.apply(on);tq.textContent=on?'Light off':'Light'}}
  $('#ctl').hidden=!(z.isSupported()||t.isSupported());
 }catch{}
}
$('#x').onclick=stopScan;
$('#scan').onclick=async()=>{
 $('#cam').hidden=false;
 sc=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13],useBarCodeDetectorIfSupported:true,verbose:false});
 try{
  let camId=null;
  try{
   const cams=await Html5Qrcode.getCameras(),isBack=c=>/back|rear|environment/i.test(c.label);
   const pick=cams.find(c=>/^back camera$/i.test(c.label))||cams.find(c=>isBack(c)&&!/ultra|tele|depth/i.test(c.label))||cams.find(isBack)||(cams.length>1?cams[cams.length-1]:cams[0]);
   camId=pick?.id||null;
  }catch{}
  const vc={width:{ideal:1920},height:{ideal:1080}};
  if(camId)vc.deviceId={exact:camId};else vc.facingMode={ideal:'environment'};
  await sc.start(camId||{facingMode:'environment'},
  {fps:15,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.floor(Math.min(h*.6,w*.5))}),videoConstraints:vc},
  async t=>{if(busy||!okIsbn(t))return;busy=true;navigator.vibrate?.(60);await stopScan();lookup(t)},()=>{});
  busy=false;setupCtl()}
 catch{alert('Camera unavailable. Allow camera access and try again.');stopScan()}
};
$('#go').onclick=async()=>{
 const n=$('#man').value.replace(/\D/g,'');
 if(n.length<10)return alert('Enter the 10 or 13 digit ISBN.');
 await stopScan();$('#man').value='';lookup(n);
};
async function lookup(isbn){
 $('#isbn').value=isbn;let b=db.books[isbn];
 if(!b){
  try{const r=await(await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json();const x=r['ISBN:'+isbn];if(x)b={title:x.title,author:(x.authors||[]).map(a=>a.name).join(', ')}}catch{}
  if(!b)try{const r=await(await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn)).json();const v=r.items?.[0]?.volumeInfo;if(v)b={title:v.title,author:(v.authors||[]).join(', ')}}catch{}
 }
 if(b){$('#title').value=b.title;$('#author').value=b.author}else alert('Book not found. Type the title and author.');
}

// ---- print view (Mon-Sun week, 15 rows per page) ----
function sheet(){
 const p=cur();if(!p)return;
 const d=new Date($('#wk').value+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);
 const a=iso(d);d.setDate(d.getDate()+6);const z=iso(d);
 const es=merged(db.entries.filter(e=>e.pid===p.id&&e.date>=a&&e.date<=z).sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id));
 window.lastRows=es;
 let h='';
 for(let i=0;i<Math.max(es.length,1);i+=15){
  const rows=es.slice(i,i+15);
  while(rows.length<15)rows.push(null);
  h+=`<div class="pgo"><div class="pg"><div class="hd">Name: <u>${esc(p.name)}</u> Student #: <u style="min-width:70px">${esc(p.no)}</u></div><h1>Daily Reading Log</h1>
  <table><colgroup><col style="width:10.5%"><col style="width:49.5%"><col style="width:24%"><col style="width:8.3%"><col style="width:7.7%"></colgroup>
  <tr><th>Date</th><th>Book Title</th><th>Author</th><th class="s"># of<br>Minutes</th><th class="s">Parent<br>Initials</th></tr>
  ${rows.map(r=>r?`<tr><td>${fmt(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.author)}</td><td class="c">${r.minutes}</td><td></td></tr>`:'<tr><td></td><td></td><td></td><td></td><td></td></tr>').join('')}</table></div></div>`;
 }
 $('#wrap').innerHTML=h;
}
// ---- landscape PDF (reliable on iPhone; browser printing ignores landscape) ----
//PDF-START
function buildPdf(J,p,es){
 const d=new J({orientation:'landscape',unit:'mm',format:'letter'});
 const x0=10,tw=259.4,xe=x0+tw,top=30,hh=12,rh=10.8;
 const cw=[10.5,49.5,24,8.3,7.7].map(v=>tw*v/100),xs=[x0];
 cw.forEach(w=>xs.push(xs[xs.length-1]+w));
 const fit=(t,w)=>{t=String(t??'');if(d.getTextWidth(t)<=w-3)return t;while(t&&d.getTextWidth(t+'...')>w-3)t=t.slice(0,-1);return t+'...'};
 for(let i=0;i<Math.max(es.length,1);i+=15){
  if(i)d.addPage();
  const rows=es.slice(i,i+15);
  d.setDrawColor(30);d.setTextColor(20);d.setLineWidth(0.3);
  // Name / Student # (top right)
  d.setFont('helvetica','normal');d.setFontSize(12);
  d.text('Student #:',xe-36,13,{align:'right'});d.line(xe-34,13.5,xe,13.5);d.text(String(p.no||''),xe-17,12.6,{align:'center'});
  const ne=xe-36-d.getTextWidth('Student #:')-4;
  d.text('Name:',ne-52,13,{align:'right'});d.line(ne-50,13.5,ne,13.5);d.text(String(p.name||''),ne-25,12.6,{align:'center'});
  // Title
  d.setFont('helvetica','bold');d.setFontSize(24);d.text('DAILY READING LOG',x0+tw/2,24,{align:'center'});
  // Grid
  const bottom=top+hh+15*rh;
  for(let r=0;r<=16;r++){const y=r===0?top:r===1?top+hh:top+hh+(r-1)*rh;d.line(x0,y,xe,y)}
  xs.forEach(x=>d.line(x,top,x,bottom));
  // Header text
  d.setFont('helvetica','normal');d.setFontSize(14);
  ['Date','Book Title','Author'].forEach((t,c)=>d.text(t,(xs[c]+xs[c+1])/2,top+hh/2+1.8,{align:'center'}));
  d.setFontSize(9);
  [['# of','Minutes'],['Parent','Initials']].forEach((t,k)=>{const c=3+k,x=(xs[c]+xs[c+1])/2;d.text(t[0],x,top+hh/2-0.6,{align:'center'});d.text(t[1],x,top+hh/2+3.2,{align:'center'})});
  // Rows
  d.setFontSize(11);
  rows.forEach((e,k)=>{
   const y=top+hh+k*rh+rh/2+1.4;
   d.text(fit(fmt(e.date),cw[0]),xs[0]+1.5,y);
   d.text(fit(e.title,cw[1]),xs[1]+1.5,y);
   d.text(fit(e.author,cw[2]),xs[2]+1.5,y);
   d.text(String(e.minutes),(xs[3]+xs[4])/2,y,{align:'center'});
  });
 }
 return d;
}
//PDF-END
$('#wk').onchange=sheet;
$('#pr').onclick=()=>{
 const p=cur();if(!p)return;
 const J=window.jspdf?.jsPDF;
 if(!J)return print();
 const d=buildPdf(J,p,window.lastRows||[]);
 const w=window.open(d.output('bloburl'),'_blank');
 if(!w)d.save('reading-log-'+p.name+'.pdf');
};
$('#nav').onclick=e=>{
 const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b===e.target));
 $('#tlog').hidden=t!=='log';$('#thist').hidden=t!=='hist';$('#tprint').hidden=t!=='print';if(t==='print')sheet();if(t==='hist')hist();
};

// ---- render ----
function render(){
 $('#prof').innerHTML=db.profiles.map(p=>`<option value="${p.id}" ${p.id===db.activeId?'selected':''}>${esc(p.name)}</option>`).join('');
 const ok=!!cur();$('#main').hidden=!ok;$('#empty').hidden=ok;$('#nav').hidden=!ok;$('#edit').hidden=!ok;
 if(!ok)return;
 hist();sheet();tick();
}
(async()=>{
 db=(await kv('get'))||db;render();
 navigator.storage?.persist?.();
})();
