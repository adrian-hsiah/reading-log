<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reading Log</title>
<style>
:root{--bg:#eef3f7;--ink:#1d2b3a;--mut:#667788;--acc:#1f4e79;--pen:#f5c542;--line:#cfd9e2}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:12px}
.bar{display:flex;gap:8px;align-items:center}
select,input,button{font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}
button{width:auto;cursor:pointer;background:var(--acc);color:#fff;border:0}
button.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
button.pen{background:var(--pen);color:var(--ink);font-weight:600}
.bar select{flex:1}
nav{display:flex;margin:12px 0;border-bottom:2px solid var(--line)}
nav button{background:none;color:var(--mut);border-radius:0;flex:1;border-bottom:3px solid transparent;margin-bottom:-2px}
nav button.on{color:var(--acc);border-color:var(--pen);font-weight:600}
form{display:grid;gap:10px}
label{font-size:14px;color:var(--mut);display:grid;gap:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
ul{list-style:none;padding:0;margin:16px 0}
li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
li button{background:none;color:var(--mut);padding:4px 10px}
small{color:var(--mut)}
#cam{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px}
#cam[hidden]{display:none}
#wrap{overflow-x:auto;margin-top:12px}
.pg{min-width:760px;background:#fff;padding:16px;margin-bottom:16px;border:1px solid var(--line)}
.hd{text-align:right;font-size:14px}.hd u{display:inline-block;min-width:140px;text-align:center}
.pg h1{text-align:center;margin:4px 0 8px;font-size:26px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid #444;padding:2px 6px;font-size:14px}
th{font-weight:400;height:34px}td{height:34px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.c{text-align:center}
[hidden]{display:none!important}
@media print{
 .noprint{display:none!important}body{background:#fff}main{max-width:none;padding:0}
 #wrap{overflow:visible;margin:0}.pg{min-width:0;border:0;padding:0;margin:0;page-break-after:always}
 td,th{height:10mm}.pg h1{font-size:24px}@page{size:landscape;margin:10mm}
}
</style></head>
<body><main>
<div class="noprint">
 <div class="bar"><select id="prof" aria-label="Child"></select>
 <button class="alt" id="edit" title="Edit">Edit</button><button class="alt" id="add" title="Add child">+ Child</button></div>
 <p id="empty" hidden>Add a child to start logging.</p>
 <nav id="nav"><button data-t="log" class="on">Log</button><button data-t="print">Print</button></nav>
</div>
<div id="main" hidden>
 <section id="tlog" class="noprint">
  <form id="f">
   <button type="button" class="pen" id="scan">Scan book barcode</button>
   <input type="hidden" id="isbn">
   <label>Book title<input id="title" required autocomplete="off"></label>
   <label>Author<input id="author" autocomplete="off"></label>
   <div class="row">
    <label>Date<input type="date" id="date" required></label>
    <label>Minutes<select id="min"></select></label>
   </div>
   <button>Save entry</button>
  </form>
  <ul id="hist"></ul>
 </section>
 <section id="tprint" hidden>
  <div class="noprint bar"><label style="flex:1">Week containing<input type="date" id="wk"></label><button id="pr" style="align-self:end">Print</button></div>
  <div id="wrap"></div>
 </section>
</div>
<p class="noprint"><button class="alt" id="bk">Backup</button> <small id="st"></small></p>
</main>
<div id="cam" hidden><div id="reader"></div><button id="x">Cancel</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async onload="initAuth()"></script>
<script>
// Paste your Google OAuth client ID here to turn on automatic Drive backup.
const CLIENT_ID='';

let db={profiles:[],activeId:null,entries:[],books:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>new Date(s+'T00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'});
const cur=()=>db.profiles.find(p=>p.id===db.activeId);

// ---- local storage (IndexedDB) ----
const idb=new Promise((res,rej)=>{const r=indexedDB.open('readinglog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=rej});
async function kv(m,v){const d=await idb;return new Promise((res,rej)=>{const s=d.transaction('kv',m==='get'?'readonly':'readwrite').objectStore('kv');const q=m==='get'?s.get('db'):s.put(v,'db');q.onsuccess=()=>res(q.result);q.onerror=rej})}
async function save(){await kv('put',db);clearTimeout(save.t);if(CLIENT_ID)save.t=setTimeout(backup,1500)}

// ---- Google Drive backup (one-way: local overwrites the backup file) ----
const G='https://www.googleapis.com';let tok=null,exp=0,tc=null;
const auth=()=>({Authorization:'Bearer '+tok});
const status=t=>$('#st').textContent=t;
function initAuth(){
 if(!CLIENT_ID){status('Backup not set up');return}
 tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.appdata',
  callback:r=>{if(r.access_token){tok=r.access_token;exp=Date.now()+r.expires_in*1000-60000;checkRestore()}}});
 status('Tap Backup to connect');
}
async function remoteId(){const r=await fetch(G+"/drive/v3/files?spaces=appDataFolder&q=name%3D'readinglog.json'&fields=files(id)",{headers:auth()});return(await r.json()).files?.[0]?.id}
async function backup(){
 if(!tok||Date.now()>exp){status('Backup paused: tap Backup to reconnect');return}
 try{
  const id=await remoteId(),body=JSON.stringify(db);
  if(id)await fetch(G+'/upload/drive/v3/files/'+id+'?uploadType=media',{method:'PATCH',headers:auth(),body});
  else{const b='rl',m=`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:'readinglog.json',parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
   await fetch(G+'/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{...auth(),'Content-Type':'multipart/related; boundary='+b},body:m})}
  status('Backed up '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
 }catch{status('Backup failed, will retry on next save')}
}
async function checkRestore(){
 try{
  const id=await remoteId();
  if(!id){backup();return}
  if(!db.profiles.length&&!db.entries.length){
   if(confirm('Backup found. Restore your data?')){
    db=await(await fetch(G+'/drive/v3/files/'+id+'?alt=media',{headers:auth()})).json();
    await kv('put',db);render();status('Restored from backup');
   }
  }else backup();
 }catch{status('Could not reach backup')}
}
$('#bk').onclick=()=>CLIENT_ID&&tc?tc.requestAccessToken():alert('Backup is not set up yet. Add a Google client ID in index.html.');

// ---- profiles ----
$('#prof').onchange=e=>{db.activeId=e.target.value;save();render()};
$('#add').onclick=()=>{
 const name=prompt('Child name');if(!name)return;
 const no=prompt('Student # (optional)')||'';
 const id='p'+Date.now();db.profiles.push({id,name,no});db.activeId=id;save();render();
};
$('#edit').onclick=()=>{
 const p=cur();if(!p)return;
 const name=prompt('Child name',p.name);if(!name)return;
 p.name=name;p.no=prompt('Student #',p.no)??p.no;save();render();
};

// ---- entry form ----
$('#min').innerHTML=Array.from({length:12},(_,i)=>(i+1)*15).map(m=>`<option ${m===30?'selected':''}>${m}</option>`).join('');
$('#date').value=iso(new Date());$('#wk').value=iso(new Date());
$('#f').onsubmit=e=>{
 e.preventDefault();
 const isbn=$('#isbn').value,title=$('#title').value.trim(),author=$('#author').value.trim();
 db.entries.push({id:Date.now(),pid:db.activeId,date:$('#date').value,title,author,minutes:+$('#min').value,isbn});
 if(isbn)db.books[isbn]={title,author};
 $('#title').value=$('#author').value=$('#isbn').value='';
 save();render();
};
$('#hist').onclick=e=>{
 const id=e.target.dataset.del;
 if(id&&confirm('Delete this entry?')){db.entries=db.entries.filter(x=>x.id!=id);save();render()}
};

// ---- barcode scan + lookup ----
let sc;
async function stopScan(){try{await sc.stop();sc.clear()}catch{}$('#cam').hidden=true}
$('#x').onclick=stopScan;
$('#scan').onclick=async()=>{
 $('#cam').hidden=false;sc=new Html5Qrcode('reader');
 try{await sc.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13]},async t=>{await stopScan();lookup(t)},()=>{})}
 catch{alert('Camera unavailable. Allow camera access and try again.');stopScan()}
};
async function lookup(isbn){
 $('#isbn').value=isbn;let b=db.books[isbn];
 if(!b){
  try{const r=await(await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`)).json();const x=r['ISBN:'+isbn];if(x)b={title:x.title,author:(x.authors||[]).map(a=>a.name).join(', ')}}catch{}
  if(!b)try{const r=await(await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn)).json();const v=r.items?.[0]?.volumeInfo;if(v)b={title:v.title,author:(v.authors||[]).join(', ')}}catch{}
 }
 if(b){$('#title').value=b.title;$('#author').value=b.author}else alert('Book not found. Type the title and author.');
}

// ---- print view (Mon-Sun week, 15 rows per page) ----
function sheet(){
 const p=cur();if(!p)return;
 const d=new Date($('#wk').value+'T00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);
 const a=iso(d);d.setDate(d.getDate()+6);const z=iso(d);
 const es=db.entries.filter(e=>e.pid===p.id&&e.date>=a&&e.date<=z).sort((x,y)=>x.date.localeCompare(y.date)||x.id-y.id);
 let h='';
 for(let i=0;i<Math.max(es.length,1);i+=15){
  const rows=es.slice(i,i+15);
  while(rows.length<15)rows.push(null);
  h+=`<div class="pg"><div class="hd">Name: <u>${esc(p.name)}</u> Student #: <u style="min-width:60px">${esc(p.no)}</u></div><h1>Daily Reading Log</h1>
  <table><colgroup><col style="width:10%"><col style="width:38%"><col style="width:28%"><col style="width:11%"><col style="width:13%"></colgroup>
  <tr><th>Date</th><th>Book Title</th><th>Author</th><th># of Minutes</th><th>Parent Initials</th></tr>
  ${rows.map(r=>r?`<tr><td>${fmt(r.date)}</td><td>${esc(r.title)}</td><td>${esc(r.author)}</td><td class="c">${r.minutes}</td><td></td></tr>`:'<tr><td></td><td></td><td></td><td></td><td></td></tr>').join('')}</table></div>`;
 }
 $('#wrap').innerHTML=h;
}
$('#wk').onchange=sheet;$('#pr').onclick=()=>print();
$('#nav').onclick=e=>{
 const t=e.target.dataset.t;if(!t)return;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b===e.target));
 $('#tlog').hidden=t!=='log';$('#tprint').hidden=t!=='print';if(t==='print')sheet();
};

// ---- render ----
function render(){
 $('#prof').innerHTML=db.profiles.map(p=>`<option value="${p.id}" ${p.id===db.activeId?'selected':''}>${esc(p.name)}</option>`).join('');
 const ok=!!cur();$('#main').hidden=!ok;$('#empty').hidden=ok;$('#nav').hidden=!ok;$('#edit').hidden=!ok;
 if(!ok)return;
 const es=db.entries.filter(e=>e.pid===db.activeId).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,30);
 $('#hist').innerHTML=es.map(e=>`<li><div><b>${esc(e.title)}</b><br><small>${fmt(e.date)} · ${esc(e.author)} · ${e.minutes} min</small></div><button data-del="${e.id}" aria-label="Delete">✕</button></li>`).join('')||'<li><small>No entries yet.</small></li>';
 sheet();
}
(async()=>{
 db=(await kv('get'))||db;render();
 navigator.storage?.persist?.();
})();
</script>
</body></html>
